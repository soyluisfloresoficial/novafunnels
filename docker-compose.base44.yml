services:
  db:
    image: postgres:15
    restart: on-failure
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./supabase-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    image: supabase/gotrue:v2.132.0
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: ""
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_JWT_ISSUER: http://localhost:3000
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      API_EXTERNAL_URL: http://localhost:3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  rest:
    image: postgrest/postgrest:v11.2.0
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_ANON_ROLE: anon
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    image: nginx:alpine
    restart: on-failure
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
    volumes:
      - ./nginx-supabase.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:80/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3

  migrate:
    image: postgres:15
    depends_on:
      auth:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./supabase/migrations:/migrations:ro
    command: ["sh", "-c", "psql -U postgres -h db -d postgres -c 'SELECT 1 FROM chats LIMIT 1' 2>/dev/null || psql -U postgres -h db -d postgres -f /migrations/20230707053030_init.sql"]
    restart: "no"

  web:
    image: node:18
    restart: on-failure
    depends_on:
      gateway:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./:/app
    working_dir: /app
    command: ["sh", "-ec", "npm install -g pnpm@8 && CI=true pnpm install --frozen-lockfile && exec pnpm dev"]
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 90s
